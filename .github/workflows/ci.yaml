name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.12.0"
          enable-cache: false
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --all-groups --locked --python ${{ matrix.python }}
      - run: uv run --python ${{ matrix.python }} pytest
      - run: uv run --python ${{ matrix.python }} pre-commit validate-manifest

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.12.0"
          enable-cache: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: 1.26.5
          cache-dependency-path: go.sum
      - run: uv sync --all-groups --locked
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pyright
      - run: uv lock --check
      - run: go mod verify
      - run: uv run python scripts/verify_upstream_tags.py
      - run: uv build
      - run: git diff --exit-code

  installed-hooks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.12.0"
          enable-cache: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: 1.26.5
          cache-dependency-path: go.sum
      - run: uv sync --all-groups --locked
      - name: Install and execute representative adapters
        run: |
          uv run pre-commit try-repo . check-yaml --all-files
          uv run pre-commit try-repo . trailing-whitespace --all-files
          uv run pre-commit try-repo . ruff-check --all-files
          uv run pre-commit try-repo . ruff-format --all-files
          uv run pre-commit try-repo . gitleaks --all-files
