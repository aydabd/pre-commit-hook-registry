repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks: [{id: check-yaml}]
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks: [{id: gitleaks}]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks: [{id: ruff-check}]
  - repo: https://github.com/biomejs/pre-commit
    rev: v2.5.7
    hooks: [{id: biome-ci}]
