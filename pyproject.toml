[build-system]
requires = ["uv_build==0.12.0"]
build-backend = "uv_build"

[project]
name = "pre-commit-hook-registry"
version = "0.1.0"
description = "Secure curated pre-commit hook gateway and consumer policy validator."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "aydabd" }]
dependencies = ["PyYAML==6.0.3", "typing-extensions==4.16.0"]

[dependency-groups]
dev = [
  "coverage[toml]==7.15.2",
  "pre-commit==4.6.1",
  "pyright==1.1.411",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.15.22",
  "types-PyYAML==6.0.12.20250915",
]

[project.scripts]
pre-commit-hook-registry = "pre_commit_hook_registry.cli:main"

[tool.uv]
required-version = ">=0.12.0,<0.13"
package = true

[tool.uv.build-backend]
module-name = "pre_commit_hook_registry"
module-root = "src"

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
markers = ["installed_examples: execute rendered consumer templates and their installed hooks"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E501"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "strict"
include = ["src", "tests"]
reportUnknownArgumentType = "none"
reportUnknownLambdaType = "none"
reportUnknownMemberType = "none"
reportUnknownParameterType = "none"
reportUnknownVariableType = "none"
reportUnnecessaryComparison = "none"
